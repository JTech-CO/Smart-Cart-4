" fill="#294534" font-size="22" font-weight="600" text-anchor="start">좌 / 우 구동 분기</text><text x="1423" y="225" fill="#55705d" font-size="18" font-weight="400" text-anchor="start">JDRV OPEN → IBT-2 좌/우</text><text x="1423" y="257" fill="#92713c" font-size="16" font-weight="400" text-anchor="start">27V 상한 / 29.2V 직결 금지</text></g><g class="node" data-node="DC1" tabindex="0" role="button" aria-label="안전정지 전원 · DC1"><rect class="node-body" x="55" y="400" width="350" height="126" rx="8" fill="#f9faf6" stroke="#a5baac" stroke-width="1.7"/><rect x="55" y="400" width="5" height="126" rx="2" fill="#ba9e5a"/><text x="73" y="433" fill="#294534" font-size="22" font-weight="600" text-anchor="start">안전정지 전원 · DC1</text><text x="73" y="465" fill="#55705d" font-size="18" font-weight="400" text-anchor="start">F3 → 24V buck-boost → F9</text><text x="73" y="497" fill="#92713c" font-size="16" font-weight="400" text-anchor="start">B1의 12V 코일 설계와 호환 아님</text></g><g class="node" data-node="SR1" tabindex="0" role="button" aria-label="안전릴레이 · SR1"><rect class="node-body" x="510" y="400" width="395" height="126" rx="8" fill="#f9faf6" stroke="#a5baac" stroke-width="1.7"/><rect x="510" y="400" width="5" height="126" rx="2" fill="#ba9e5a"/><text x="528" y="433" fill="#294534" font-size="22" font-weight="600" text-anchor="start">안전릴레이 · SR1</text><text x="528" y="465" fill="#55705d" font-size="18" font-weight="400" text-anchor="start">2채널 E-stop / 수동 RESET / EDM</text><text x="528" y="497" fill="#92713c" font-size="16" font-weight="400" text-anchor="start">접촉기 해제는 기계적 제동이 아님</text></g><g class="node" data-node="CLL" tabindex="0" role="button" aria-label="로컬 회생 처리 · CLL/R"><rect class="node-body" x="1030" y="400" width="345" height="126" rx="8" fill="#f9faf6" stroke="#a5baac" stroke-width="1.7"/><rect x="1030" y="400" width="5" height="126" rx="2" fill="#749580"/><text x="1048" y="433" fill="#294534" font-size="22" font-weight="600" text-anchor="start">로컬 회생 처리 · CLL/R</text><text x="1048" y="465"